name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis
            artifact: sonata-windows-x64
            # The hosted Windows runner builds its native MSVC target in the
            # ordinary host-target directory (no explicit --target is passed).
            path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-latest
            bundles: dmg
            artifact: sonata-macos-arm64
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: sonata-linux-x64
            path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the native package
        run: npm run tauri build -- --features desktop,custom-protocol --bundles ${{ matrix.bundles }}

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release and attach native packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**
